apiVersion: v1
kind: Service
metadata:
  name: {{ include "schema-rag.fullname" . }}
  labels:
    {{- include "schema-rag.labels" . | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - port: {{ .Values.app.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    {{- include "schema-rag.selectorLabels" . | nindent 4 }}
